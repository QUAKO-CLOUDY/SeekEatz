<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're on the waitlist — SeekEatz</title>
    <meta name="robots" content="noindex" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="min-h-screen bg-white overflow-x-hidden flex justify-center">
      <div class="w-full max-w-2xl py-10 lg:py-16 px-4 md:px-6 lg:px-8 mx-auto space-y-8">
        <header class="mb-6 lg:mb-8">
          <div class="text-3xl lg:text-4xl font-semibold text-gray-900">SeekEatz</div>
        </header>

        <section class="flex flex-col items-center justify-center text-center space-y-6 py-12">
          <div class="w-16 h-16 bg-cyan-500 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </div>

          <h1 class="text-3xl sm:text-4xl font-semibold text-gray-900">You're on the waitlist!</h1>

          <p class="text-base sm:text-lg text-gray-600 max-w-md mx-auto leading-relaxed">
            Thanks for signing up for SeekEatz. The first 100 people to join will receive first month
            free when we launch. We'll email you as soon as the app is ready, keep an eye on your
            inbox.
          </p>

          <a
            href="./index.html"
            class="mt-4 px-6 py-3 bg-cyan-500 text-white font-medium rounded-lg hover:bg-cyan-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 transition-all text-sm sm:text-base"
          >
            Back to waitlist
          </a>
        </section>
      </div>
    </main>
  </body>
</html>
